<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · pf-demo</title>
    <script>
      // Apply the theme before the first paint so a dark page doesn't flash light.
      // Mirrors initialTheme() and WebStorageThemePreferenceStore; ThemeProvider takes over once React runs.
      try {
        const stored = localStorage.getItem('pf-demo.theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
